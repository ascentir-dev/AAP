email:
  coach:
    Variant 1:
      framework: PPP — Praise / Picture / Push
      subject_formula: saw {company}'s {observation}
      word_count: 130-160
      ai_fills: '{personalized_hook}, {their_business_description}, {target_outcome}'
      template: |
        Hi {first_name}, hope you're having a great week.

        {company} genuinely caught my eye. {personalized_hook} — and that kind of track record deserves a qualified appointment calendar that matches it.

        My team's reviewed your {their_business_description}, and we're confident your qualified appointment calendar gets 120 qualified appointments in 120 days, done-for-you, driving {target_outcome}.

        Best part: if those qualified appointments don't land, you don't pay. 120 qualified appointments in 120 days. Guaranteed.

        By the way, this isn't an automated message. I'm a real person. I know you get a ton of these every week. This isn't one of them. See the exact system that handles this done-for-you:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        We've helped coaches and training firms add 30 qualified appointments in their first 30 days, 7 new clients enrolled, without launching every quarter or running a single ad.

        If {company} has room for new enrollments, reply and I'll show you exactly how many qualified appointments we'd generate.

        Thanks,
        Frank

        P.S. When I say pay on results, I really mean it. You pay nothing unless qualified appointments land on your calendar. No qualified appointments, no cost.
    Variant 2:
      framework: PPP — Compact Warm
      subject_formula: quick question, {first_name}
      word_count: 70-90
      ai_fills: '{personalized_hook}, {motion_based_pain_observation}, {their_business_description}'
      template: |
        Hey {first_name}, {personalized_hook} — but {motion_based_pain_observation}.

        Quick context: my team has reviewed {company}'s {their_business_description}, and we're confident your qualified appointment calendar gets 120 qualified appointments in 120 days, done-for-you, on a complete pay-on-results basis. No qualified appointments booked, no payment. Simple.

        Not a robot, I promise. See the exact system that handles this done-for-you:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        If {company} has room for new enrollments, reply and I'll show you exactly how many qualified appointments we'd generate.

        Frank

        P.S. If you're thinking this sounds like another AI email blaster, it isn't. This is done-for-you outbound built specifically for high-ticket coaches and training firms, and you pay nothing unless qualified appointments land on your calendar. The demo takes 60 seconds. Reply VIDEO and I'll send it.
    Variant 3:
      framework: PPP + Average-Lift Proof
      subject_formula: '{company} + Ascentir'
      word_count: 100-130
      ai_fills: '{personalized_hook}, {their_business_description}, {target_outcome}, {motion_pain_brief}'
      template: |
        Hi {first_name},

        First: {company} looks great.

        We've reviewed your {their_business_description} — {personalized_hook} — and we're confident we can book 120 qualified appointments in 120 days, driving {target_outcome} without relying on {motion_pain_brief} to fill the pipeline. Done-for-you, guaranteed: if we don't hit the number, you don't pay.

        I send these personally, not from bulk software. I know you get a lot of automated emails every week. This isn't one of them. See the exact numbers before deciding anything:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        On average, we book 30 qualified appointments in 30 days for every coach we work with in the first 8 weeks.

        If {company} has room for new enrollments, reply — I'll show you exactly how many qualified appointments we'd generate.

        Thanks,
        Frank

        P.S. If you're thinking this sounds like another AI email blaster — it isn't. This is done-for-you outbound and you pay nothing unless qualified appointments land on your calendar. The demo takes 60 seconds. Reply VIDEO and I'll send it.
    Variant 4:
      framework: AIDA — Niche Authority + Direct Ask
      subject_formula: how we find {company}'s best buyers
      word_count: 110-140
      ai_fills: '{their_industry}, {personalized_hook}'
      template: |-
        {first_name},

        Most {their_industry} businesses run outbound the same way: bought contact lists, scraped LinkedIn, the same cold databases every competitor is using. The result is predictable — low response rates, indifferent prospects, campaigns that grind instead of scale.

        We built something different.

        Ascentir runs Atlas — our high-intent private AI database — cross-referenced against your specific market in real time to identify exactly who is in-market for what you sell right now. Not last quarter. Not a static list. Right now, actively looking.

        Our Agentic Acquisition Platform reaches those contacts before any competitor does. The result: qualified appointments from people who were already looking — not cold contacts you had to convince from scratch.

        {company} came up as a strong fit. I'd rather show you how it works than explain it in an email:

        Reply VIDEO and I'll send you a personalized demo of the Agentic Acquisition Platform (AAP) — showing exactly how we'd book {company} 120 qualified appointments in 90 days. No call. No pitch. Just the demo.

        Frank

        P.S. We're selective about partners — not because of capacity, but because signal quality degrades when too many businesses target the same contacts. If this is the right fit, I'll tell you directly. You pay nothing unless qualified appointments land on your calendar.
    Variant 5:
      framework: 3 Cs — Compliment / Case Study / CTA
      subject_formula: results from {{their_industry}} businesses like {{company}}
      word_count: 110-140
      ai_fills: '{personalized_hook}, {their_industry}'
      template: |-
        Hey {first_name},

        {personalized_hook} — and that kind of operation deserves a qualified appointment calendar that matches it.

        Recent results from businesses we've worked with using the Agentic Acquisition Platform:

                • High-ticket coach — referral-only pipeline, no outbound: 30 qualified appointments in 30 days, 7 new clients enrolled
                • CPA reduced from $25 to $2.80 per qualified lead using our private behavioral database — same offer, better targeting
                • Coaching business: 23 calls booked, 3 closed one-call deals, $34K revenue from $2,983 in total spend

        The common thread: they weren't reaching more people. They were reaching the right people — identified by our private AI behavioral database — at the exact moment those people were in-market.

        See if {company} qualifies to be next:

        Reply VIDEO and I'll send you a personalized demo of the Agentic Acquisition Platform (AAP) — showing exactly how we'd book {company} 120 qualified appointments in 90 days. No call. No pitch. Just the demo.

        Frank

        P.S. The system books 120 guaranteed qualified appointments in 90 days. You pay nothing unless they land on your calendar. The demo takes 60 seconds. Reply VIDEO and I'll send it.
    Variant 6:
      framework: QVC — Question / Value / CTA
      subject_formula: who in {their_industry} is buying right now?
      word_count: 50-70
      ai_fills: '{their_industry}'
      template: |-
        Hey {first_name}, quick question: what if you could see exactly who in your target market is actively in-market right now — identified by real-time behavioral signals — and reach them before any competitor does?

        That's what AAP does. 120 qualified appointments in 90 days, or you don't pay.

        Reply VIDEO and I'll send you a personalized demo of the Agentic Acquisition Platform (AAP) — showing exactly how we'd book {company} 120 qualified appointments in 90 days. No call. No pitch. Just the demo.

        Frank
    Variant 7:
      framework: Demand Flip
      subject_formula: taking on new clients?
      word_count: 85-110
      ai_fills: '{personalized_hook}, {their_state}'
      template: |
        {first_name},

        {personalized_hook} — and yet {company} is still running on referrals and manual outreach for new enrollments. That's exactly the ceiling we help high-ticket coaches and training firms break out of.

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        Quick question: are you currently taking on new enrollments? I've been routing coaching clients in {their_state} to coaches with capacity. If {company} has room, let me know and I'll explain the process.

        Cheers,
        Frank
    Variant 8:
      framework: Inverted Demand / Scarcity
      subject_formula: heads up — {their_industry} coach inquiry
      word_count: 85-110
      ai_fills: '{their_industry}, {personalized_hook}'
      template: |
        Hi {first_name},

        Seeing a lot of {their_industry} coaches actively working on new enrollments right now. {company} came up as one of the stronger fits — {personalized_hook} — and we're adding 2 new coaching partners in your space this quarter. Wanted to reach out before we go wider.

        We're adding 2 new coaching partners. 1 spot is currently open.

        See if you're still a fit before we go wider:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        Cheers,
        Frank

        P.S. Not automated. Real person. And if you're thinking this sounds like another AI email blaster — it isn't. Done-for-you outbound, you pay nothing unless qualified appointments land on your calendar. The demo takes 60 seconds.
    Variant 9:
      framework: PAS — Problem / Agitate / Solve
      subject_formula: '{{first_name}}'
      word_count: 110-140
      ai_fills: '{hook_observation_concerning}, {their_industry}'
      template: |-
        Hey {first_name},

        Honest observation about {company}: {hook_observation_concerning}

        Here's the real problem most {their_industry} businesses don't talk about: it's not the offer. It's not the copy. It's that outbound built on public contact databases reaches the same exhausted contacts as every competitor — at the wrong time, without knowing who's actually in-market.

        The {their_industry} businesses booking appointments consistently aren't working harder. They have access to better data. Every month without it is another 30 qualified appointments that went to whoever got there first.

        Our Agentic Acquisition Platform (AAP) fixes this using Atlas — our private high-intent AI database:

        Reply VIDEO and I'll send you a personalized demo of the Agentic Acquisition Platform (AAP) — showing exactly how we'd book {company} 120 qualified appointments in 90 days. No call. No pitch. Just the demo.

        I run Ascentir. We built a private AI behavioral database that identifies exactly who in your target market is actively in-market right now — then reaches them before any competitor does. 120 guaranteed qualified appointments in 90 days, done-for-you. You pay nothing unless appointments land on your calendar.

        After looking at {company}, I'm confident we could move the needle.

        Frank

        P.S. The demo takes 60 seconds and shows the exact mechanism. It's the fastest way to understand why the results are different from every other outbound platform you've seen. Reply VIDEO and I'll send it.
