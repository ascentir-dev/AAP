# =============================================================================
# templates.yaml — Market-specific email + SMS scaffolds
# Structure: email.[market].[Variant N] / sms.[market].[SMS-VN]
# Markets: coach | agency | consultant | financial_advisor | msp
#
# AI fills the {token} placeholders at generation time.
# The structural copy, pain framing, and proof claims are hand-crafted
# per market so Claude only handles lead-specific personalization.
#
# Bridge lines are intentionally video-neutral — they introduce {VIDEO_LINK}
# cleanly for video emails AND let it substitute to the Reply VIDEO block
# for email-only sends without needing regex replacement.
#
# Subject line formulas — one per variant, drawn from two top-performing pools:
#   V1: "saw {company}'s {observation}"      — personalization + curiosity
#   V2: "quick question, {first_name}"       — 1:1 feel, highest open rate
#   V3: "{company} + Ascentir"               — partnership signal
#   V4: "a thought on {company}'s pipeline"  — value-forward
#   V5: "30 [market-term] in 30 days"        — specific proof number
#   V6: "question for {first_name}"          — curiosity trigger pool
#   V7: "taking on new clients?"             — demand-flip frame
#   V8: "{their_state} — one spot open"      — territory + bounded scarcity
#   V9: "{first_name}"                       — just the name, pattern interrupt
#
# Offer anchor: "30 qualified [market-term] in 30 days, guaranteed."
# Guarantee mechanism: "you pay nothing unless [market-term] land on your calendar."
# =============================================================================

email:

  # ---------------------------------------------------------------------------
  # COACHES — High-ticket coaches & professional training firms
  # Language: enrollments, qualified appointments, ideal clients, program, launch
  # ---------------------------------------------------------------------------
  coach:

    Variant 1:
      framework: PPP — Praise / Picture / Push
      subject_formula: "saw {company}'s {observation}"
      word_count: 130-160
      ai_fills: "{personalized_hook}, {their_business_description}, {target_outcome}"
      template: |
        Hi {first_name}, hope you're having a great week.

        {company} genuinely caught my eye. {personalized_hook} — and that kind of track record deserves a qualified appointment calendar that matches it.

        My team's reviewed your {their_business_description}, and we're confident your qualified appointment calendar gets 120 qualified qualified appointments in 120 days, done-for-you, driving {target_outcome}.

        Best part: if those qualified appointments don't land, you don't pay. 120 qualified qualified appointments in 120 days. Guaranteed.

        By the way, this isn't an automated message. I'm a real person. I know you get a ton of these every week. This isn't one of them. See the exact system that handles this done-for-you:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        We've helped coaches and training firms add 30 qualified qualified appointments in their first 30 days, 7 new clients enrolled, without launching every quarter or running a single ad.

        If {company} has room for new enrollments, reply and I'll show you exactly how many qualified appointments we'd generate.

        Thanks,
        Frank

        P.S. When I say pay on results, I really mean it. You pay nothing unless qualified qualified appointments land on your calendar. No qualified appointments, no cost.

    Variant 2:
      framework: PPP — Compact Warm
      subject_formula: "quick question, {first_name}"
      word_count: 70-90
      ai_fills: "{personalized_hook}, {motion_based_pain_observation}, {their_business_description}"
      template: |
        Hey {first_name}, {personalized_hook} — but {motion_based_pain_observation}.

        Quick context: my team has reviewed {company}'s {their_business_description}, and we're confident your qualified appointment calendar gets 120 qualified qualified appointments in 120 days, done-for-you, on a complete pay-on-results basis. No qualified appointments booked, no payment. Simple.

        Not a robot, I promise. See the exact system that handles this done-for-you:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        If {company} has room for new enrollments, reply and I'll show you exactly how many qualified appointments we'd generate.

        Frank

        P.S. If you're thinking this sounds like another AI email blaster, it isn't. This is done-for-you outbound built specifically for high-ticket coaches and training firms, and you pay nothing unless qualified qualified appointments land on your calendar. The demo takes 60 seconds. Reply VIDEO and I'll send it.

    Variant 3:
      framework: PPP + Average-Lift Proof
      subject_formula: "{company} + Ascentir"
      word_count: 100-130
      ai_fills: "{personalized_hook}, {their_business_description}, {target_outcome}, {motion_pain_brief}"
      template: |
        Hi {first_name},

        First: {company} looks great.

        We've reviewed your {their_business_description} — {personalized_hook} — and we're confident we can book 120 qualified qualified appointments in 120 days, driving {target_outcome} without relying on {motion_pain_brief} to fill the pipeline. Done-for-you, guaranteed: if we don't hit the number, you don't pay.

        I send these personally, not from bulk software. I know you get a lot of automated emails every week. This isn't one of them. See the exact numbers before deciding anything:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        On average, we book 30 qualified qualified appointments in 30 days for every coach we work with in the first 8 weeks.

        If {company} has room for new enrollments, reply — I'll show you exactly how many qualified appointments we'd generate.

        Thanks,
        Frank

        P.S. If you're thinking this sounds like another AI email blaster — it isn't. This is done-for-you outbound and you pay nothing unless qualified appointments land on your calendar. The demo takes 60 seconds. Reply VIDEO and I'll send it.

    Variant 4:
      framework: AIDA — Niche Authority + Direct Ask
      subject_formula: "a thought on {company}'s pipeline"
      word_count: 80-100
      ai_fills: "{their_industry}"
      template: |
        {first_name},

        Saw {company} is in {their_industry}. Strong ties here. We work specifically with {their_industry} coaches who are tired of new business depending entirely on referrals and the coach's personal network.

        Most hit the same wall: enrollment is feast-or-famine — great months after a launch, quiet months in between — and there's no systematic way to fix it without a dedicated outbound engine.

        See the exact system that handles this done-for-you:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        If {company} has room for new enrollments, reply — I'll show you exactly how many qualified appointments we'd generate.

        Cheers,
        Frank

        P.S. Personal email. I'll be the one replying. And you pay nothing unless qualified appointments land on your calendar.

    Variant 5:
      framework: 3 Cs — Compliment / Case Study / CTA
      subject_formula: "30 qualified appointments in 30 days"
      word_count: 90-120
      ai_fills: "{personalized_hook}"
      template: |
        Hey {first_name},

        {company} {personalized_hook} — and that kind of operation deserves a qualified appointment calendar that matches it.

        Recent results from coaches and training firms we've worked with:

        • High-ticket coach — referral-only pipeline, no outbound system: 30 qualified qualified appointments in 30 days, 7 new clients enrolled
