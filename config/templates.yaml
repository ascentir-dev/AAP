      framework: Direct Value
      char_limit: 160
      ai_fills: '{personalized_hook}, {specific_promise}'
      template: '{first_name}, {personalized_hook}. We book consulting firms 30 qualified appointments in 30 days, pay-on-results.
        60-sec demo: {VIDEO_LINK} Reply DEMO. Frank'
    SMS-V2:
      framework: Social Proof
      char_limit: 160
      ai_fills: '{their_industry}, {proof_result}'
      template: '{first_name}, a {their_industry} firm we worked with just booked 30 qualified appointments in 30 days, 3
        new engagements. Demo: {VIDEO_LINK} Same for {company}? Frank'
    SMS-V3:
      framework: Question Hook
      char_limit: 160
      ai_fills: '{specific_outcome}'
      template: '{first_name}: is {company}''s engagement pipeline still refilling through referrals? 30 qualified appointments
        in 30 days, pay-on-results. Demo: {VIDEO_LINK} Frank'
    SMS-V4:
      framework: PAS
      char_limit: 170
      ai_fills: '{hook_observation_one_line}, {agitation}'
      template: '{first_name}, {hook_observation_one_line}. For consulting firms that means {agitation} — every quiet month
        is 30 qualified appointments that didn''t happen. Fix: {VIDEO_LINK} Frank'
    SMS-V5:
      framework: Compliment + CTA
      char_limit: 160
      ai_fills: '{hook_compliment}, {specific_promise}'
      template: '{first_name}, {hook_compliment}. We get consulting firms 30 qualified appointments in 30 days, done-for-you,
        pay-on-results. Demo: {VIDEO_LINK} Frank'
    SMS-V6:
      framework: Scarcity
      char_limit: 165
      ai_fills: '{their_state}'
      template: '{first_name}, {company} came up as a top fit. Adding 2 advisory partners in {their_state} this quarter —
        1 spot open. Demo before we go wider: {VIDEO_LINK} Frank'
