        See if {company} qualifies to be next on this list:

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        If {company} has room for new enrollments, reply — I'll show you exactly how many qualified appointments we'd generate.

        Thanks,
        Frank

        P.S. If you're thinking this sounds like another AI email blaster — it isn't. This is done-for-you outbound and you pay nothing unless qualified appointments land on your calendar. The demo takes 60 seconds. Reply VIDEO and I'll send it.

    Variant 6:
      framework: QVC — Question / Value / CTA
      subject_formula: "120 qualified appointments in 120 days?"
      word_count: 45-65
      ai_fills: "none"
      template: |
        Hey {first_name}, quick q: if {company} could have 120 qualified qualified appointments in 120 days land on the calendar in the next 120 days, with no payment until they do, is that worth 60 seconds?

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        If {company} has room for new enrollments, reply and I'll show you exactly how many qualified appointments we'd generate.

        Frank

    Variant 7:
      framework: Demand Flip
      subject_formula: "taking on new clients?"
      word_count: 85-110
      ai_fills: "{personalized_hook}, {their_state}"
      template: |
        {first_name},

        {personalized_hook} — and yet {company} is still running on referrals and manual outreach for new enrollments. That's exactly the ceiling we help high-ticket coaches and training firms break out of.

        Reply VIDEO and I'll send you a personalized demo of the AI Client Acquisition System showing exactly how we'll book {company} 120 appointments in 90 days. No call, no pitch. Just the demo.

        Quick question: are you currently taking on new enrollments? I've been routing coaching clients in {their_state} to coaches with capacity. If {company} has room, let me know and I'll explain the process.

        Cheers,
        Frank

    Variant 8:
      framework: Inverted Demand / Scarcity
      subject_formula: "heads up — {their_industry} coach inquiry"
      word_count: 85-110
      ai_fills: "{their_industry}, {personalized_hook}"
      template: |
        Hi {first_name},

        Seeing a lot of {their_industry} coaches actively working on new enrollments right now. {company} came up as one of the stronger fits — {personalized_hook} — and we're adding 2 new coaching partners in your space this quarter. Wanted to reach out before we go wider.

