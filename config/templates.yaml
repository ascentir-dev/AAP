sms:
  coach:
    SMS-V1:
      framework: Direct Value
      char_limit: 160
      ai_fills: '{personalized_hook}, {specific_promise}'
      template: '{first_name}, {personalized_hook}. We book coaches 30 qualified appointments in 30 days, pay-on-results.
        Reply VIDEO and I''ll send our AI Client Acquisition System. Frank'
    SMS-V2:
      framework: Social Proof
      char_limit: 160
      ai_fills: '{their_industry}, {proof_result}'
      template: '{first_name}, a {their_industry} coach we worked with just booked 30 qualified appointments in 30 days, 7
        new clients enrolled. Same for {company}? Reply VIDEO and I''ll send our AI Client Acquisition System. Frank'
    SMS-V3:
      framework: Question Hook
      char_limit: 160
