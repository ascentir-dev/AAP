email:
  coach:
    Variant 1:
      framework: PPP — Praise / Picture / Push
      subject_formula: saw {company}'s {observation}
      word_count: 65-85
      ai_fills: '{personalized_hook}, {target_outcome}, {big_result}'
      template: |
        {first_name},

        {company} caught my eye. {personalized_hook}.

        Your business gets 120 qualified appointments in 120 days, done-for-you, driving {target_outcome}. Guaranteed: if the calls don't land, you get a full refund plus $3K.

        {big_result}

        Reply VIDEO and I'll send a personalized demo of how we'd book {company} 120 appointments. No call, no pitch.

        Frank

        P.S. 120 appointments in 120 days or a full refund plus $3K. No appointments, no cost.
    Variant 2:
      framework: PPP — Compact Warm
      subject_formula: quick question, {first_name}
      word_count: 40-60
      ai_fills: '{personalized_hook}, {motion_based_pain_observation}'
      template: |
        {first_name},

        {personalized_hook} — but {motion_based_pain_observation}.

        Your business gets 120 qualified appointments in 120 days, done-for-you. Guaranteed: miss that and you get a full refund plus $3K.

        Reply VIDEO and I'll send the demo. 60 seconds, no call.

        Frank
    Variant 3:
      framework: Quick Idea — Proof + Guarantee
      subject_formula: 'quick idea for {company}'
      word_count: 50-70
      ai_fills: '{personalized_hook}, {comparable_client_result}'
      template: |
        {first_name},

        {personalized_hook}. Worth a quick note.

        We handle all the outbound for your {their_industry} team (cold email, SMS, LinkedIn) and guarantee 120 booked calls in 120 days or a full refund plus $3K.

        {comparable_client_result}

        Worth a quick look?

        Frank
    Variant 4:
      framework: AIDA — Niche Authority + Direct Ask
      subject_formula: your best buyers
      word_count: 70-95
      ai_fills: '{their_industry}'
      template: |-
        {first_name},

        Most {their_industry} businesses target the same exhausted contact lists as every competitor. Same databases. Same low reply rates.

        We built something different. Our AI identifies who in your market is actively looking right now, using real-time behavioral signals, before any competitor reaches them.

        {company} came up as a strong fit.

        Reply VIDEO and I'll send a personalized demo. No call, no pitch.

        Frank

        P.S. Guaranteed: 120 appointments in 120 days or a full refund plus $3K.
    Variant 5:
      framework: 3 Cs — Compliment / Case Study / CTA
      subject_formula: 'a few results, {first_name}'
      word_count: 75-100
      ai_fills: '{personalized_hook}, {motion_appropriate_results_list}'
      template: |-
        {first_name},

        {personalized_hook}. A few results from similar {their_industry} businesses:

        {motion_appropriate_results_list}

        Not more volume. Better data, better timing.

        See if {company} qualifies to be next:

        Reply VIDEO and I'll send the personalized demo.

        Frank

        P.S. Guaranteed: 120 appointments in 120 days or a full refund plus $3K.
    Variant 6:
      framework: QVC — Question / Value / CTA
      subject_formula: who's buying now?
      word_count: 45-65
      ai_fills: '{their_industry}'
      template: |-
        {first_name},

        Quick question: who in your market is actively looking to buy right now?

        Our AI identifies exactly those prospects using real-time behavioral signals, before any competitor reaches them. 120 qualified appointments in 120 days, guaranteed or a full refund plus $3K.

        Reply VIDEO and I'll send the personalized demo.

        Frank
    Variant 7:
      framework: Demand Flip
      subject_formula: taking on new clients?
      word_count: 45-65
      ai_fills: '{personalized_hook}, {market_clients_term}, {their_state}'
      template: |
        {first_name},

        {personalized_hook}.

        Quick question: are you taking on new {market_clients_term} in {their_state}?

        I route qualified leads to businesses with capacity. If {company} has room, worth a quick chat?

        Frank
    Variant 8:
      framework: Right Person — Cost Contrast + Routing
      subject_formula: '{first_name}, booked calls?'
      word_count: 60-80
      ai_fills: '{market_outcome}'
      template: |-
        {first_name},

        Are you the right person at {company} to talk about {market_outcome}?

        Most {their_industry} teams your size spend $15K-$40K/mo on tools, lead data, and setters. Still get inconsistent results.

        We do it all with AI, guaranteed: 120 booked calls in 120 days or a full refund plus $3K.

        Right person? Open to seeing how it'd work for {company}? If not, who should I ask?

        Frank
    Variant 9:
      framework: PAS — Problem / Agitate / Solve
      subject_formula: '{first_name}'
      word_count: 70-90
      ai_fills: '{hook_observation_concerning}, {their_industry}'
      template: |-
        {first_name},

        {hook_observation_concerning}

        Real problem: most {their_industry} businesses target the same exhausted databases as every competitor. Wrong timing, wrong contacts. Every month it continues, qualified calls go to whoever got there first.

        Our AI identifies who in your market is in-market right now, before any competitor reaches them.

        Open to seeing it?

        Frank

        P.S. Guaranteed: 120 appointments in 120 days or a full refund plus $3K.

