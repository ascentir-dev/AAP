# =============================================================================
# Video Script Variants — 4 proven structures × 5 markets
# Each market has V1-V4 with the same structural styles but market-native
# vocabulary and the updated offer anchor:
#   "120 qualified [market-term] in 120 days, guaranteed."
#
# Tone: CONFIDENT above all. Excited, warm, genuine. NOT robotic.
#
# ElevenLabs eleven_v3 delivery cues:
#   [excited]           → upbeat energetic delivery
#   [warm]              → friendly, genuine tone
#   [chuckles]          → natural human laugh moment
#   [pause]             → deliberate beat
#   [thoughtful]        → slower, considered delivery
#   [genuine]           → sincere, direct
#   <break time="0.3s"> → micro-pause
#   <break time="0.6s"> → longer pause
#   CAPS                → stressed word — conviction
#
# Placeholders: {first_name}  {company}
# Target length: 110–180 words (~45–75 seconds spoken)
# =============================================================================

variants:

  # ---------------------------------------------------------------------------
  # COACHES — High-ticket coaches & professional training firms
  # ---------------------------------------------------------------------------
  coach:

    V1:
      name: "Two Reasons (Warm Personal)"
      hook_style: "two_reasons"
      description: >
        Opens with 'two reasons for this video' — disarms with personal touch
        first, then pivots to the opportunity. Warm, confident, high trust.
      script: |
        Hey {first_name} — [warm] okay so I was just going through {company}'s site and I had to record this. <break time="0.3s" />

        Two reasons I'm sending this over. <break time="0.3s" /> First — just to prove I'm a real human being. Your website's right here on screen. Not an automated blast. [chuckles] One person to another.

        But the SECOND reason is the one I'm actually excited about. <break time="0.6s" />

        [excited] We've built a done-for-you outbound acquisition system that books coaches and training firms 120 QUALIFIED discovery calls in 120 days — guaranteed. And I want to give {company} that exact same system. Pay on results. <break time="0.3s" />

        Which means a full calendar of ideal clients every single month. [genuine] If we don't deliver? You don't pay. Simple.

        Nine times out of ten, people respond to these — because honestly... the offer's kind of hard to say no to. <break time="0.3s" />

        Worth a quick reply?

    V2:
      name: "Not a Robot (Systematic)"
      hook_style: "not_a_robot"
      description: >
        Thanks them for clicking, breaks the offer down term by term with
        conviction. Methodical build to a confident close. Great for
        analytical coaches who want the details.
      script: |
        Hey — [warm] it's Frank. Thank you so much for clicking — I genuinely appreciate it.

        Look, I made this video to add real effort to my outreach. [pause] But honestly? I've also got something for {first_name} that I'm really excited about. <break time="0.6s" />

        Short version — we can get {company} 120 QUALIFIED discovery calls in the next 120 days. Pay on results. <break time="0.3s" />

        And I mean qualified — someone who actually has the budget AND the genuine desire to invest in your program. Not tyre-kickers. REAL prospective clients. <break time="0.3s" /> [genuine] If we don't hit the number, money does NOT leave your pocket.

        Once it's built, it runs. You don't lift a finger. <break time="0.3s" /> [thoughtful] We've scaled coaching businesses using these exact outbound systems — and I want to build the same machine for {company}.

        [excited] Most coaches who get a video like this respond — because the offer is genuinely strong.

        Worth a quick chat?

    V3:
      name: "Two Guesses (Problem-First)"
      hook_style: "two_guesses"
      description: >
        Leads with empathy — two guesses about the coach's situation.
        Agitates the enrollment inconsistency problem before the solution reveal.
        Best for coaches with feast-or-famine pipelines.
      script: |
        Hey {first_name} — [warm] I want to make two guesses about where {company}'s at right now. And I think at least one of them's going to land. <break time="0.3s" />

        First guess: you're actually really good at what you do. But the enrollment pipeline — [thoughtful] it's not as consistent as it needs to be. Some months you're fully booked. Some months you're launching again just to keep it moving.

        Second guess: you've tried to fix this before. Ads, funnels, hiring — and it just... didn't convert the way it was supposed to. <break time="0.6s" />

        [genuine] If either of those hits? You are EXACTLY who we built this for. <break time="0.3s" />

        [excited] Here's what we do. We build a done-for-you AI outbound system that books {company} 120 qualified discovery calls in 120 days — every month, consistently, without you launching or posting. Pay on results, so there's ZERO risk.

        Worth a quick reply?

    V4:
      name: "Boy Oh Boy (High Energy)"
      hook_style: "high_energy_bold"
      description: >
        High-energy opener. Bold promise fast. Humour to disarm.
        Confident, memorable, punchy. Works brilliantly with founder-coaches
        who are growth-minded and action-oriented.
      script: |
        [excited] Boy oh boy — have I got something for you. Thank you for clicking on this.

        My name's Frank — and I've pulled up {company}'s website right here, just to prove I'm a real human and not a robot. [chuckles] I know, I know — you get a LOT of outreach. But hear me out. <break time="0.3s" />

        Short version: I can get {company} 120 qualified discovery calls in the next 120 days. <break time="0.3s" /> Here's the kicker — pay on results.

        We figured out how to systematise outbound for coaches so well that we actually GUARANTEE the results. We do not profit unless you profit. [genuine] Bold statement — I know. But we've done it across coaching niches from business to health to professional training.

        Leave your card at home. Honestly — put it in the freezer if you want. [chuckles] All I need is 20 minutes. Click the red button. Let's see if it's a fit.

